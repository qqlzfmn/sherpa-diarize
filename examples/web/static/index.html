<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>sherpa-diarize 流式说话人分离</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --fg: #e8eaf0; --dim: #8b93a5; --accent: #4d9fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .controls { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  select, input[type=text], button {
    background: #1e222b; color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #startBtn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  main { display: flex; flex: 1; min-height: 0; }
  .timeline-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .timeline-wrap {
    position: relative; flex: 1; margin: 12px 16px 0; overflow-x: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  }
  #timeline { position: relative; height: 120px; min-width: 100%; }
  #axis { position: relative; height: 24px; margin: 0 16px; border-bottom: 1px solid var(--border); }
  .axis-tick { position: absolute; bottom: 0; color: var(--dim); font-size: 11px; transform: translateX(-50%); }
  .axis-tick::before { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 4px; background: var(--border); }
  .seg { position: absolute; top: 20px; height: 80px; border-radius: 6px; opacity: .85; cursor: pointer; }
  .seg:hover { opacity: 1; }
  .seg .label {
    position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 600;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap;
  }
  #cursor {
    position: absolute; top: 0; bottom: 0; width: 2px; background: #fff;
    box-shadow: 0 0 4px rgba(255,255,255,.6); display: none;
  }
  #legend { display: flex; gap: 14px; padding: 8px 16px 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .legend-item .chip { width: 12px; height: 12px; border-radius: 3px; }
  .transcript {
    width: 380px; margin: 12px 16px 12px 0; padding: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  }
  .transcript h2 { font-size: 13px; color: var(--dim); font-weight: 600; }
  .tline { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .tline .time { color: var(--dim); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tline .who { font-weight: 600; white-space: nowrap; }
  .tline .txt { color: var(--fg); word-break: break-all; }
  .tline .conf { color: var(--dim); font-size: 11px; }
  footer { display: flex; gap: 16px; padding: 8px 16px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--border); }
  .status { color: var(--accent); }
  .status.error { color: #ff6b6b; }
  .status.done { color: #51cf66; }
</style>
</head>
<body>
<header>
  <h1>sherpa-diarize</h1>
  <span class="sub">端侧实时流式说话人分离 + ASR 转写</span>
  <div class="controls">
    <input id="wavPath" type="text" placeholder="音频路径（相对项目根，默认 demo）" size="32">
    <select id="asrMode">
      <option value="none">无 ASR</option>
      <option value="offline" selected>ASR 离线</option>
      <option value="streaming">ASR 流式</option>
    </select>
    <select id="speed">
      <option value="0">最快</option>
      <option value="8">8x</option>
      <option value="4">4x</option>
      <option value="2">2x</option>
      <option value="1" selected>1x</option>
    </select>
    <button id="startBtn">启动</button>
    <button id="stopBtn" disabled>停止</button>
  </div>
</header>
<main>
  <div class="timeline-panel">
    <div class="timeline-wrap" id="timelineWrap">
      <div id="timeline"><div id="cursor"></div></div>
    </div>
    <div id="axis"></div>
    <div id="legend"></div>
  </div>
  <div class="transcript" id="transcript">
    <h2>转写</h2>
  </div>
</main>
<footer>
  <span id="status" class="status">未连接</span>
  <span id="progress"></span>
  <span id="summary"></span>
</footer>

<script>
const PALETTE = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#bfef45","#fabed4","#469990","#dcbeff","#9a6324"];
const $ = id => document.getElementById(id);
let ws, duration = 0, events = [], started = false;

function colorOf(speaker) { return PALETTE[speaker % PALETTE.length]; }
function fmt(t) {
  const m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, "0");
  return `${m}:${s}`;
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setStatus("已连接", "");
  ws.onclose = () => { setStatus("连接断开", ""); if (started) enableStart(); };
  ws.onerror = () => setStatus("连接错误", "error");
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}

function handle(msg) {
  switch (msg.type) {
    case "started":
      duration = msg.duration; events = []; started = true;
      $("timeline").innerHTML = '<div id="cursor"></div>';
      $("transcript").innerHTML = "<h2>转写</h2>";
      $("legend").innerHTML = ""; $("summary").textContent = "";
      renderAxis();
      setStatus("回放中…", "");
      $("startBtn").disabled = true; $("stopBtn").disabled = false;
      break;
    case "event":
      events.push(msg);
      renderSegment(msg);
      appendTranscript(msg);
      break;
    case "progress":
      moveCursor(msg.t);
      $("progress").textContent = `${fmt(msg.t)} / ${fmt(duration)}`;
      break;
    case "done":
      started = false;
      $("progress").textContent = `${fmt(duration)} / ${fmt(duration)}`;
      setStatus(`完成：${events.length} 个 turn，${msg.speakers} 个说话人`, "done");
      renderLegend();
      enableStart();
      break;
    case "error":
      setStatus(msg.message, "error");
      enableStart();
      break;
  }
}

function setStatus(text, cls) {
  const el = $("status");
  el.textContent = text;
  el.className = "status" + (cls ? " " + cls : "");
}
function enableStart() {
  $("startBtn").disabled = false; $("stopBtn").disabled = true;
}

function renderAxis() {
  const axis = $("axis");
  axis.innerHTML = "";
  const n = Math.max(1, Math.ceil(duration / 5));
  for (let i = 0; i <= n; i++) {
    const t = (duration / n) * i;
    const tick = document.createElement("div");
    tick.className = "axis-tick";
    tick.style.left = `${(t / duration) * 100}%`;
    tick.textContent = fmt(t);
    axis.appendChild(tick);
  }
}

function renderSegment(ev) {
  const tl = $("timeline");
  const el = document.createElement("div");
  el.className = "seg";
  el.style.left = `${(ev.start / duration) * 100}%`;
  el.style.width = `${Math.max(0.15, ((ev.end - ev.start) / duration) * 100)}%`;
  el.style.background = colorOf(ev.speaker);
  el.innerHTML = `<span class="label">S${ev.speaker}</span>`;
  el.title = `${fmt(ev.start)} - ${fmt(ev.end)}  speaker_${ev.speaker} (conf ${ev.confidence})\n${ev.text || ""}`;
  tl.appendChild(el);
}

function appendTranscript(ev) {
  const box = $("transcript");
  const line = document.createElement("div");
  line.className = "tline";
  line.innerHTML =
    `<span class="time">${fmt(ev.start)}</span>` +
    `<span class="who" style="color:${colorOf(ev.speaker)}">S${ev.speaker}</span>` +
    `<span class="txt">${escapeHtml(ev.text || "")}</span>` +
    `<span class="conf">${ev.confidence.toFixed(2)}</span>`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function renderLegend() {
  const legend = $("legend");
  const dur = {};
  events.forEach(e => { dur[e.speaker] = (dur[e.speaker] || 0) + (e.end - e.start); });
  Object.keys(dur).sort((a, b) => a - b).forEach(s => {
    const item = document.createElement("span");
    item.className = "legend-item";
    item.innerHTML = `<span class="chip" style="background:${colorOf(+s)}"></span> speaker_${s} ${dur[s].toFixed(1)}s`;
    legend.appendChild(item);
  });
}

function moveCursor(t) {
  const cur = $("cursor");
  cur.style.display = "block";
  cur.style.left = `${(t / duration) * 100}%`;
  const wrap = $("timelineWrap");
  if (cur.offsetLeft > wrap.clientWidth - 60) {
    wrap.scrollLeft = cur.offsetLeft - wrap.clientWidth + 120;
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

$("startBtn").onclick = () => {
  ws.send(JSON.stringify({
    type: "start",
    wav: $("wavPath").value.trim(),
    asr_mode: $("asrMode").value,
    speed: parseFloat($("speed").value),
  }));
};
$("stopBtn").onclick = () => ws.send(JSON.stringify({ type: "stop" }));

connect();
</script>
</body>
</html>
