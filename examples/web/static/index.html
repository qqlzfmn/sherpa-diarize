<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sherpa-diarize 流式说话人分离</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --fg: #e8eaf0; --dim: #8b93a5; --accent: #4d9fff;
    --partial: #5c6472; /* 流式未确认文本（灰） */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .controls { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  select, button {
    background: #1e222b; color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #startBtn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .src-tabs { display: flex; gap: 4px; padding: 10px 16px 0; }
  .src-tabs button { border-radius: 6px 6px 0 0; background: transparent; border-color: transparent; color: var(--dim); }
  .src-tabs button.active { background: var(--panel); border-color: var(--border); border-bottom-color: var(--panel); color: var(--fg); }
  .src-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .src-bar .hint { color: var(--dim); font-size: 12px; }
  input[type=file] { color: var(--dim); font-size: 12px; }
  .rec-ind { width: 10px; height: 10px; border-radius: 50%; background: #ff6b6b; display: inline-block; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  main { display: flex; flex: 1; min-height: 0; }
  .timeline-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .timeline-wrap { position: relative; flex: 1; min-height: 0; margin: 12px 16px 0; overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  #timeline { position: relative; height: 120px; min-width: 100%; }
  #axis { position: relative; height: 24px; margin: 0 16px; border-bottom: 1px solid var(--border); }
  .axis-tick { position: absolute; bottom: 0; color: var(--dim); font-size: 11px; transform: translateX(-50%); }
  .axis-tick::before { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 4px; background: var(--border); }
  .seg { position: absolute; top: 20px; height: 80px; border-radius: 6px; opacity: .85; cursor: pointer; }
  .seg:hover { opacity: 1; }
  .seg .label { position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; }
  #cursor { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 4px rgba(255,255,255,.6); display: none; }
  #legend { display: flex; gap: 14px; padding: 8px 16px 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .legend-item .chip { width: 12px; height: 12px; border-radius: 3px; }
  .transcript { width: 400px; min-height: 0; margin: 12px 16px 12px 0; padding: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .transcript h2 { font-size: 13px; color: var(--dim); font-weight: 600; flex: none; }
  .tline { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .tline .time { color: var(--dim); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tline .who { font-weight: 600; white-space: nowrap; }
  .tline .txt { color: var(--fg); word-break: break-all; transition: color .3s; }
  .tline .txt.partial { color: var(--partial); font-style: italic; }
  .tline .conf { color: var(--dim); font-size: 11px; }
  footer { display: flex; gap: 16px; padding: 8px 16px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--border); }
  .status { color: var(--accent); }
  .status.error { color: #ff6b6b; }
  .status.done { color: #51cf66; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <header>
    <h1>sherpa-diarize</h1>
    <span class="sub">端侧实时流式说话人分离 + ASR 转写</span>
    <div class="controls">
      <select id="asrMode" v-model="asrMode">
        <option value="none">无 ASR</option>
        <option value="offline">ASR 离线</option>
        <option value="streaming">ASR 流式</option>
      </select>
      <select id="speed" v-model="speed" :disabled="source==='record'">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
        <option value="0">最快</option>
      </select>
      <button id="startBtn" :disabled="busy || !canStart" @click="start">启动</button>
      <button :disabled="!busy" @click="stopAll">停止</button>
    </div>
  </header>

  <div class="src-tabs">
    <button v-for="s in sources" :key="s.id" :class="{active: source===s.id}" @click="switchSource(s.id)">{{ s.label }}</button>
  </div>

  <div class="src-bar">
    <template v-if="source==='demo'">
      <select id="demoFile" v-model="demoFile">
        <option v-for="(p, name) in demoWavs" :key="name" :value="p">{{ name }}</option>
      </select>
      <button :disabled="busy" @click="loadDemo">加载</button>
      <span class="hint">{{ loadedInfo }}</span>
    </template>
    <template v-else-if="source==='upload'">
      <input type="file" accept="audio/*" @change="onUpload">
      <span class="hint">{{ loadedInfo }}</span>
    </template>
    <template v-else>
      <button :disabled="busy" @click="toggleRecord">
        <span v-if="!recording">开始录音</span>
        <span v-else><span class="rec-ind"></span> 停止并处理</span>
      </button>
      <span class="hint">{{ recording ? '录音中… ' + recSec.toFixed(1) + 's' : loadedInfo }}</span>
    </template>
    <span v-if="loadedInfo && !recording" style="margin-left:auto">
      <button :disabled="busy" @click="playPause">{{ playing ? '暂停' : '播放' }}</button>
    </span>
  </div>

  <main>
    <div class="timeline-panel">
      <div class="timeline-wrap" ref="timelineWrap">
        <div id="timeline" :style="{width: duration>0 ? '100%' : '100%'}">
          <div v-for="ev in events" :key="ev.key" class="seg"
               :style="{left: pct(ev.start)+'%', width: Math.max(0.15, pct(ev.end-ev.start))+'%', background: colorOf(ev.speaker)}"
               :title="ev.start.toFixed(2)+'-'+ev.end.toFixed(2)+' speaker_'+ev.speaker+'\n'+(ev.text||'')">
            <span class="label">S{{ ev.speaker }}</span>
          </div>
          <div id="cursor" :style="{display: cursor>=0 ? 'block' : 'none', left: pct(cursor)+'%'}"></div>
        </div>
      </div>
      <div id="axis">
        <div v-for="t in axisTicks" :key="t" class="axis-tick" :style="{left: pct(t)+'%'}">{{ fmt(t) }}</div>
      </div>
      <div id="legend">
        <span v-for="(dur, sid) in speakerDurs" :key="sid" class="legend-item">
          <span class="chip" :style="{background: colorOf(+sid)}"></span> speaker_{{ sid }} {{ dur.toFixed(1) }}s
        </span>
      </div>
    </div>

    <div class="transcript" ref="transcriptBox">
      <h2>转写</h2>
      <div v-for="row in transcript" :key="row.key" class="tline">
        <span class="time">{{ fmt(row.start) }}</span>
        <span class="who" :style="{color: colorOf(row.speaker)}">S{{ row.speaker }}</span>
        <span class="txt" :class="{partial: row.partial}">{{ row.text }}</span>
        <span class="conf" v-if="!row.partial">{{ row.confidence.toFixed(2) }}</span>
      </div>
    </div>
  </main>

  <footer>
    <span class="status" :class="{error: status==='错误', done: status==='完成'}">{{ status }}</span>
    <span>{{ cursor >= 0 ? fmt(cursor) + ' / ' + fmt(duration) : '' }}</span>
    <span v-if="events.length">{{ events.length }} turns</span>
  </footer>
</div>

<script src="/static/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;
const PALETTE = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#bfef45","#fabed4","#469990","#dcbeff","#9a6324"];
const colorOf = s => PALETTE[s % PALETTE.length];
const fmt = t => { const m = Math.floor(t/60), s = (t%60).toFixed(1).padStart(4,"0"); return m + ":" + s; };
const CHUNK = 1600; // 100ms @16k

createApp({
  data() {
    return {
      sources: [
        { id: "demo", label: "示例音频" },
        { id: "upload", label: "上传音频" },
        { id: "record", label: "录音" },
      ],
      source: "demo",
      asrMode: "streaming",
      speed: 1,
      demoWavs: {},
      demoFile: "",
      asrModes: { offline: false, streaming: false },
      loadedInfo: "",
      audio: null,          // AudioBuffer
      audioCtx: null,
      playing: false,
      busy: false,
      recording: false,
      recSec: 0,
      ws: null,
      events: [],           // {key,start,end,speaker,confidence,text}
      transcript: [],       // {key,start,speaker,text,confidence,partial}
      duration: 0,
      cursor: -1,
      status: "未连接",
      sendTimer: null,
      recTimer: null,
      lastSeq: 0,
    };
  },
  computed: {
    canStart() {
      if (this.busy) return false;
      if (this.source === "demo") return !!this.audio;
      if (this.source === "upload") return !!this.audio;
      return false; // record 模式由录音流程处理
    },
    axisTicks() {
      if (!this.duration) return [0];
      const n = Math.max(1, Math.ceil(this.duration / 5));
      const out = [];
      for (let i = 0; i <= n; i++) out.push((this.duration / n) * i);
      return out;
    },
    speakerDurs() {
      const d = {};
      this.events.forEach(e => { d[e.speaker] = (d[e.speaker] || 0) + (e.end - e.start); });
      return d;
    },
  },
  methods: {
    pct(t) { return this.duration > 0 ? (t / this.duration) * 100 : 0; },
    fmt,
    colorOf,
    async fetchModels() {
      const r = await fetch("/api/models");
      const m = await r.json();
      this.demoWavs = m.demo_wavs;
      this.demoFile = Object.values(m.demo_wavs)[0] || "";
      this.asrModes = { offline: m.asr_offline_ready, streaming: m.asr_streaming_ready };
      if (!m.asr_offline_ready && !m.asr_streaming_ready) this.asrMode = "none";
      else if (this.asrMode === "streaming" && !m.asr_streaming_ready) this.asrMode = "offline";
      this.connect();
    },
    connect() {
      this.ws = new WebSocket(`ws://${location.host}/ws`);
      this.ws.binaryType = "arraybuffer";
      this.ws.onopen = () => { this.status = "已连接"; };
      this.ws.onclose = () => { this.status = this.status === "完成" ? this.status : "连接断开"; };
      this.ws.onmessage = ev => this.handle(JSON.parse(ev.data));
    },
    handle(msg) {
      switch (msg.type) {
        case "started":
          this.resetView();
          this.status = "处理中…";
          break;
        case "event":
          this.pushEvent(msg);
          break;
        case "partial":
          this.setPartial(msg.text);
          break;
        case "progress":
          this.cursor = msg.t;
          break;
        case "done":
          this.status = `完成：${this.events.length} turns / ${msg.speakers} 说话人`;
          this.busy = false; this.stopSendTimer();
          break;
        case "error":
          this.status = "错误：" + msg.message; this.busy = false;
          break;
      }
    },
    resetView() {
      this.events = []; this.transcript = []; this.duration = this.audio ? this.audio.duration : 0;
      this.cursor = -1; this.lastSeq = 0;
    },
    pushEvent(ev) {
      this.lastSeq++;
      const key = "e" + this.lastSeq;
      this.events.push({ key, ...ev });
      // 若存在该 turn 的 partial 占位行，转为正式行（变白）
      const p = this.transcript.find(r => r.partial && r.key === key);
      if (p) Object.assign(p, { partial: false, confidence: ev.confidence, text: ev.text });
      else this.transcript.push({ key, start: ev.start, speaker: ev.speaker, text: ev.text, confidence: ev.confidence, partial: false });
      this.scrollTranscript();
    },
    setPartial(text) {
      if (!text) return;
      const last = this.transcript[this.transcript.length - 1];
      if (last && last.partial) { last.text = text; }
      else this.transcript.push({ key: "p" + this.lastSeq, start: this.cursor, speaker: -1, text, confidence: 0, partial: true });
      this.scrollTranscript();
    },
    scrollTranscript() {
      this.$nextTick(() => { const b = this.$refs.transcriptBox; if (b) b.scrollTop = b.scrollHeight; });
    },
    stopSendTimer() {
      if (this.sendTimer) { clearInterval(this.sendTimer); this.sendTimer = null; }
    },
    async loadDemo() {
      const resp = await fetch(this.demoFile);
      const buf = await resp.arrayBuffer();
      await this.decode(buf);
      this.loadedInfo = `${this.audio.duration.toFixed(1)}s 示例音频`;
    },
    async onUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      await this.decode(buf);
      this.loadedInfo = `${file.name} (${this.audio.duration.toFixed(1)}s)`;
    },
    async decode(buf) {
      if (!this._playCtx) this._playCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ab = await this._playCtx.decodeAudioData(buf);
      // 混单声道 + 重采样 16k
      const src = ab.getChannelData(0);
      const ratio = ab.sampleRate / 16000;
      const n = Math.floor(src.length / ratio);
      const out = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const pos = i * ratio;
        const i0 = Math.floor(pos), i1 = Math.min(i0 + 1, src.length - 1);
        const frac = pos - i0;
        out[i] = src[i0] * (1 - frac) + src[i1] * frac;
      }
      this.audio = { data: out, duration: n / 16000 };
      this.duration = this.audio.duration;
      this.playing = false;
    },
    playPause() {
      if (!this.audio || !this._playCtx) return;
      if (this.playing) { this._playCtx.suspend(); this.playing = false; }
      else {
        if (!this._bufSrc) {
          const b = this._playCtx.createBuffer(1, this.audio.data.length, 16000);
          b.copyToChannel(this.audio.data, 0);
          this._bufSrc = this._playCtx.createBufferSource();
          this._bufSrc.buffer = b; this._bufSrc.connect(this._playCtx.destination);
          this._bufSrc.start();
        }
        this._playCtx.resume(); this.playing = true;
      }
    },
    async start() {
      if (this.busy) return;
      if (this.source === "record") return; // 录音经 toggleRecord
      this.busy = true;
      this.resetView();
      this.ws.send(JSON.stringify({ type: "config", asr_mode: this.asrMode }));
      await this.awaitStarted();
      this.cursor = 0;
      const speed = parseFloat(this.speed);
      const interval = speed > 0 ? Math.max(10, 100 / speed) : 0;
      let i = 0;
      this.sendTimer = setInterval(() => {
        if (i >= this.audio.data.length) { this.finishSend(); return; }
        const chunk = this.audio.data.subarray(i, i + CHUNK);
        this.ws.send(chunk);  // TypedArray 只发送 view 范围
        this.cursor = (i + chunk.length) / 16000;
        i += CHUNK;
      }, interval);
    },
    awaitStarted() {
      return new Promise(resolve => {
        const onmsg = ev => {
          const m = JSON.parse(ev.data);
          if (m.type === "started") { this.ws.removeEventListener("message", onmsg); resolve(); }
          if (m.type === "error") { this.ws.removeEventListener("message", onmsg); this.status = "错误：" + m.message; this.busy = false; resolve(); }
        };
        this.ws.addEventListener("message", onmsg);
      });
    },
    finishSend() {
      clearInterval(this.sendTimer); this.sendTimer = null;
      this.ws.send(JSON.stringify({ type: "end" }));
      this.cursor = this.duration;
    },
    async toggleRecord() {
      if (!this.recording) {
        if (this.busy) return;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this._stream = stream;
          this._recCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
          const src = this._recCtx.createMediaStreamSource(stream);
          const proc = this._recCtx.createScriptProcessor(4096, 1, 1);
          src.connect(proc); proc.connect(this._recCtx.destination);
          this._proc = proc; this._src = src;
          this.ws.send(JSON.stringify({ type: "config", asr_mode: this.asrMode }));
          await this.awaitStarted();
          this.resetView();
          this.recording = true; this.busy = true;
          this.recSec = 0;
          this.recTimer = setInterval(() => { this.recSec += 0.1; this.cursor = this.recSec; this.duration = Math.max(this.duration, this.recSec); }, 100);
          proc.onaudioprocess = e => {
            if (this.recording && this.ws.readyState === 1) {
              this.ws.send(e.inputBuffer.getChannelData(0));  // TypedArray 只发送 view 范围
            }
          };
        } catch (err) { this.status = "错误：麦克风不可用 " + err.message; }
      } else {
        this.recording = false;
        clearInterval(this.recTimer);
        this._proc.disconnect(); this._src.disconnect();
        this._stream.getTracks().forEach(t => t.stop());
        this.ws.send(JSON.stringify({ type: "end" }));
      }
    },
    stopAll() {
      if (this.recording) this.toggleRecord();
      else if (this.sendTimer) { clearInterval(this.sendTimer); this.sendTimer = null; }
      this.ws.send(JSON.stringify({ type: "stop" }));
      this.busy = false;
    },
    switchSource(id) { this.source = id; this.loadedInfo = ""; },
  },
  mounted() { this.fetchModels(); },
}).mount("#app");
</script>
</body>
</html>
